<body>
  <canvas id="vanke-canvas" aria-label="深圳留仙洞总部基地与万科云城设计公社 12 层 ASCII 场景" title="移动鼠标体验 12 层景深视差 · 点击任意位置重播字符雨入场"></canvas>

  <script>
    const MIN_X = -129, MAX_X = 129, MIN_Y = -48, MAX_Y = 47;
    const BOUNDS = { minX: MIN_X, maxX: MAX_X, minY: MIN_Y, maxY: MAX_Y };

    function charWidth(ch) {
      if (!ch) return 1;
      const cp = ch.codePointAt(0);
      return (
        (cp >= 0x1100 && cp <= 0x115f) ||
        (cp >= 0x2e80 && cp <= 0xa4cf && cp !== 0x303f) ||
        (cp >= 0xac00 && cp <= 0xd7a3) ||
        (cp >= 0xf900 && cp <= 0xfaff) ||
        (cp >= 0xfe10 && cp <= 0xfe19) ||
        (cp >= 0xfe30 && cp <= 0xfe6f) ||
        (cp >= 0xff00 && cp <= 0xff60) ||
        (cp >= 0xffe0 && cp <= 0xffe6)
      ) ? 2 : 1;
    }

    class AsciiLayer {
      constructor(slot, name, depthRate) {
        this.slot = slot;
        this.name = name;
        this.depthRate = depthRate;
        this.visible = true;
        this.cells = {};
      }
      set(x, y, ch, ink = false) {
        x = Math.round(x);
        y = Math.round(y);
        if (x < MIN_X || x > MAX_X || y < MIN_Y || y > MAX_Y) return;
        if (!ch || (ch === " " && !ink)) {
          delete this.cells[`${x},${y}`];
          return;
        }
        const w = charWidth(ch);
        if (x + w - 1 > MAX_X) return;
        delete this.cells[`${x},${y}`];
        if (w === 2) delete this.cells[`${x + 1},${y}`];
        const prev = this.cells[`${x - 1},${y}`];
        if (prev && charWidth(prev.char) === 2) delete this.cells[`${x - 1},${y}`];
        this.cells[`${x},${y}`] = { char: ch, ink };
      }
      text(x, y, str, ink = true) {
        let cx = Math.round(x);
        for (const ch of [...str]) {
          const w = charWidth(ch);
          this.set(cx, y, ch, ch === " " ? ink : false);
          cx += w;
        }
      }
      stampSolid(x, y, lines) {
        for (let dy = 0; dy < lines.length; dy++) {
          const chars = [...lines[dy]];
          let first = -1, last = -1;
          for (let i = 0; i < chars.length; i++) {
            if (chars[i] !== " ") {
              if (first === -1) first = i;
              last = i;
            }
          }
          if (first === -1) continue;
          let cx = Math.round(x);
          for (let i = 0; i < chars.length; i++) {
            const ch = chars[i];
            const w = charWidth(ch);
            if (i >= first && i <= last) {
              this.set(cx, y + dy, ch, ch === " ");
            }
            cx += w;
          }
        }
      }
    }

    const SCRAMBLE_CHARS = "!<>-_\\\\/[]{}=+*^?#%@·.:;'";
    const TOTAL_REVEAL_MS = 2800;
    const CASCADE_MS = 2000;
    const BASE_DURATION_MS = 360;
    const TICK_MS = 48;

    function normalizeGlyph(ch) {
      return ch === "‾" ? "¯" : ch;
    }

    function hashCell(slot, x, y) {
      let r = Math.imul(x ^ 2654435769, 2246822507);
      r ^= Math.imul(y ^ slot, 3266489909);
      r ^= r >>> 16;
      return r >>> 0;
    }

    function computeViewport(width, height, dpr, bounds) {
      const rows = bounds.maxY - bounds.minY + 1;
      const cols = bounds.maxX - bounds.minX + 1;
      const cellHeight = Math.max(height / rows, width / (cols / 2));
      const cellWidth = cellHeight / 2;
      const visibleRows = height / cellHeight;
      const centerX = (bounds.minX + bounds.maxX + 1) / 2;
      const centerY = (bounds.minY + bounds.maxY + 1) / 2;
      const bottomLimit = Math.min(bounds.maxY + 1, 48);
      const focusY = Math.max(centerY, bottomLimit - visibleRows / 2);
      return {
        width,
        height,
        dpr: Math.min(2, Math.max(1, dpr || 1)),
        cellWidth,
        cellHeight,
        worldWidth: cols * cellWidth,
        originX: width / 2 - centerX * cellWidth,
        originY: height / 2 - focusY * cellHeight
      };
    }

    class LayerCache {
      constructor(layer, viewport) {
        this.layer = layer;
        this.viewport = viewport;
        this.settled = new Set();
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const entries = Object.entries(layer.cells);
        for (const [k, v] of entries) {
          const [x, y] = k.split(",").map(Number);
          const w = charWidth(v.char);
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x + w - 1);
          maxY = Math.max(maxY, y);
        }
        this.bounds = entries.length ? { minX, minY, maxX, maxY } : { minX: 0, minY: 0, maxX: 0, maxY: 0 };
        this.canvas = document.createElement("canvas");
        const wPx = (this.bounds.maxX - this.bounds.minX + 1) * viewport.cellWidth;
        const hPx = (this.bounds.maxY - this.bounds.minY + 1) * viewport.cellHeight;
        this.canvas.width = Math.max(1, Math.ceil(wPx * viewport.dpr));
        this.canvas.height = Math.max(1, Math.ceil(hPx * viewport.dpr));
        this.ctx = this.canvas.getContext("2d");
        this.ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
        this.ctx.font = `${viewport.cellHeight}px "jgs7", "PingFang SC", "Hiragino Sans GB", Menlo, monospace`;
        this.ctx.textBaseline = "top";
        this.ctx.imageSmoothingEnabled = false;
      }

      drawCell(ctx, ch, px, py, customColor) {
        const glyph = normalizeGlyph(ch);
        const w = charWidth(ch) * this.viewport.cellWidth;
        ctx.fillStyle = "#000000";
        ctx.fillRect(px, py, w, this.viewport.cellHeight);
        if (ch !== " ") {
          ctx.fillStyle = customColor || "rgba(200, 190, 181, 0.60)";
          ctx.fillText(glyph, px, py);
        }
      }

      settle(item) {
        if (item.slot !== this.layer.slot || this.settled.has(item.key)) return false;
        this.settled.add(item.key);
        this.drawCell(
          this.ctx,
          item.char,
          (item.x - this.bounds.minX) * this.viewport.cellWidth,
          (item.y - this.bounds.minY) * this.viewport.cellHeight
        );
        return true;
      }

      draw(targetCtx, offsetX, offsetY, wrapWidth = 0) {
        if (!this.layer.visible) return;
        const w = this.canvas.width / this.viewport.dpr;
        const h = this.canvas.height / this.viewport.dpr;
        const baseX = this.viewport.originX + this.bounds.minX * this.viewport.cellWidth + offsetX;
        const baseY = this.viewport.originY + this.bounds.minY * this.viewport.cellHeight + offsetY;
        targetCtx.drawImage(this.canvas, baseX, baseY, w, h);
        if (wrapWidth > 0) {
          targetCtx.drawImage(this.canvas, baseX - wrapWidth, baseY, w, h);
          targetCtx.drawImage(this.canvas, baseX + wrapWidth, baseY, w, h);
        }
      }
    }

    class SkylineRenderer {
      constructor(canvas, layers, bounds) {
        this.canvas = canvas;
        this.layers = layers;
        this.bounds = bounds;
        this.viewport = computeViewport(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight), window.devicePixelRatio, bounds);
        this.ctx = canvas.getContext("2d");
        canvas.width = Math.max(1, Math.round(this.viewport.width * this.viewport.dpr));
        canvas.height = Math.max(1, Math.round(this.viewport.height * this.viewport.dpr));
        this.ctx.setTransform(this.viewport.dpr, 0, 0, this.viewport.dpr, 0, 0);
        this.ctx.font = `${this.viewport.cellHeight}px "jgs7", "PingFang SC", "Hiragino Sans GB", Menlo, monospace`;
        this.ctx.textBaseline = "top";
        this.ctx.imageSmoothingEnabled = false;

        this.caches = layers.map(l => new LayerCache(l, this.viewport));
        this.schedule = [];
        const totalRows = Math.max(1, bounds.maxY - bounds.minY);
        for (const layer of layers) {
          for (const [k, cell] of Object.entries(layer.cells)) {
            const [x, y] = k.split(",").map(Number);
            const h = hashCell(layer.slot, x, y);
            const normY = Math.min(1, Math.max(0, (y - bounds.minY) / totalRows));
            const startMs = Math.round(normY * CASCADE_MS + (h % 141));
            const durationMs = Math.min(BASE_DURATION_MS + (h % 261), TOTAL_REVEAL_MS - startMs);
            this.schedule.push({
              ...cell,
              key: `${layer.slot}:${k}`,
              slot: layer.slot,
              x,
              y,
              startMs,
              durationMs
            });
          }
        }
        this.schedule.sort((a, b) => a.startMs - b.startMs || a.slot - b.slot || a.y - b.y || a.x - b.x);
        this.pending = new Set(this.schedule.map(i => i.key));
      }

      cellState(item, elapsedMs) {
        if (elapsedMs < item.startMs) return { phase: "hidden" };
        if (elapsedMs >= item.startMs + item.durationMs) return { phase: "settled", glyph: normalizeGlyph(item.char) };
        const step = Math.floor((elapsedMs - item.startMs) / TICK_MS);
        const idx = hashCell(item.slot, item.x + step * 17, item.y - step * 11) % 24;
        return { phase: "scrambling", glyph: SCRAMBLE_CHARS[idx] || "?" };
      }

      clear() {
        this.ctx.fillStyle = "#000000";
        this.ctx.fillRect(0, 0, this.viewport.width, this.viewport.height);
      }

      settleAll() {
        for (const item of this.schedule) {
          if (this.pending.has(item.key)) {
            const cache = this.caches.find(c => c.layer.slot === item.slot);
            if (cache) cache.settle(item);
            this.pending.delete(item.key);
          }
        }
      }

      drawReveal(elapsedMs) {
        for (const item of this.schedule) {
          if (this.pending.has(item.key) && this.cellState(item, elapsedMs).phase === "settled") {
            const cache = this.caches.find(c => c.layer.slot === item.slot);
            if (cache) cache.settle(item);
            this.pending.delete(item.key);
          }
        }
        this.clear();
        for (const cache of this.caches) {
          if (!cache.layer.visible) continue;
          cache.draw(this.ctx, 0, 0);
          for (const item of this.schedule) {
            if (item.slot !== cache.layer.slot || !this.pending.has(item.key)) continue;
            const st = this.cellState(item, elapsedMs);
            if (st.phase === "scrambling") {
              cache.drawCell(
                this.ctx,
                st.glyph,
                this.viewport.originX + item.x * this.viewport.cellWidth,
                this.viewport.originY + item.y * this.viewport.cellHeight,
                "rgba(235, 225, 215, 0.85)"
              );
            }
          }
        }
        return this.pending.size === 0 ? "settled" : "reveal";
      }

      drawScene(pointer, parallaxScale, spriteOffsets) {
        this.clear();
        for (const cache of this.caches) {
          const slot = cache.layer.slot;
          const px = pointer.x * cache.layer.depthRate * -6 * parallaxScale;
          const py = pointer.y * cache.layer.depthRate * -4 * parallaxScale;
          const spriteShift = (spriteOffsets[slot] || 0) * this.viewport.cellWidth;
          const wrapW = LAYER_SPRITE_VELOCITIES[slot] ? this.viewport.worldWidth : 0;
          cache.draw(this.ctx, px + spriteShift, py, wrapW);
        }
      }
    }

    async function initApp() {
      const canvas = document.getElementById("vanke-canvas");
      const layers = buildVankeCommuneLayers();

      try {
        await document.fonts?.load("16px jgs7");
      } catch (e) {}

      const parallaxScale = 2.0;
      let phase = "reveal";
      let revealStartTs = null;
      let lastTs = 0;
      let currentPtr = { x: 0, y: 0 };
      let targetPtr = { x: 0, y: 0 };
      let spriteOffsets = { 5: 0, 10: 0 };

      let renderer = new SkylineRenderer(canvas, layers, BOUNDS);

      function tick(ts) {
        const dt = lastTs === 0 ? 16 : Math.min(50, ts - lastTs);
        lastTs = ts;

        if (phase === "reveal") {
          if (revealStartTs === null) revealStartTs = ts;
          const elapsed = Math.min(TOTAL_REVEAL_MS, ts - revealStartTs);
          phase = renderer.drawReveal(elapsed);
        } else {
          const alpha = 1 - Math.exp(-dt / 140);
          currentPtr.x += (targetPtr.x - currentPtr.x) * alpha;
          currentPtr.y += (targetPtr.y - currentPtr.y) * alpha;

          const totalCols = MAX_X - MIN_X + 1;
          for (const [slotStr, vel] of Object.entries(LAYER_SPRITE_VELOCITIES)) {
            const slot = Number(slotStr);
            spriteOffsets[slot] = ((spriteOffsets[slot] || 0) + (vel * dt) / 1000) % totalCols;
          }

          renderer.drawScene(currentPtr, parallaxScale, spriteOffsets);
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener("pointermove", e => {
        targetPtr = {
          x: Math.max(-1, Math.min(1, (e.clientX / Math.max(1, window.innerWidth)) * 2 - 1)),
          y: Math.max(-1, Math.min(1, (e.clientY / Math.max(1, window.innerHeight)) * 2 - 1))
        };
      }, { passive: true });

      window.addEventListener("pointerleave", () => {
        targetPtr = { x: 0, y: 0 };
      }, { passive: true });

      window.addEventListener("blur", () => {
        targetPtr = { x: 0, y: 0 };
      }, { passive: true });

      function triggerReplay() {
        renderer = new SkylineRenderer(canvas, layers, BOUNDS);
        phase = "reveal";
        revealStartTs = null;
      }

      window.addEventListener("click", triggerReplay);

      window.addEventListener("message", e => {
        if (!e.data) return;
        if (e.data.type === "mushenzhen:pointer" || e.data.type === "vanke:pointer") {
          targetPtr = {
            x: Math.max(-1, Math.min(1, Number(e.data.x) || 0)),
            y: Math.max(-1, Math.min(1, Number(e.data.y) || 0))
          };
        } else if (e.data.type === "mushenzhen:replay" || e.data.type === "vanke:replay") {
          triggerReplay();
        }
      });

      window.addEventListener("resize", () => {
        renderer = new SkylineRenderer(canvas, layers, BOUNDS);
        if (phase === "settled") renderer.settleAll();
      });

      requestAnimationFrame(tick);
    }

    initApp();
  </script>
</body>
</html>
