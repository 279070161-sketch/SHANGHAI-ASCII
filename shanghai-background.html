      { slot: 10, name: "高速磁悬浮列车", depthRate: 0.76 },
      { slot: 11, name: "武康大楼街景与行人车流", depthRate: 0.88 },
      { slot: 12, name: "近景露台与法国梧桐", depthRate: 1.00 }
    ];

    function charWidth(ch) {
      if (!ch) return 1;
      const cp = ch.codePointAt(0);
      return (
        (cp >= 0x1100 && cp <= 0x115f) ||
        (cp >= 0x2e80 && cp <= 0xa4cf && cp !== 0x303f) ||
        (cp >= 0xac00 && cp <= 0xd7a3) ||
        (cp >= 0xf900 && cp <= 0xfaff) ||
        (cp >= 0xfe10 && cp <= 0xfe19) ||
        (cp >= 0xfe30 && cp <= 0xfe6f) ||
        (cp >= 0xff00 && cp <= 0xff60) ||
        (cp >= 0xffe0 && cp <= 0xffe6)
      ) ? 2 : 1;
    }

    function normalizeGlyph(ch) {
      return ch === "‾" ? "¯" : ch;
    }

    function computeViewport(width, height, dpr, bounds) {
      const rows = bounds.maxY - bounds.minY + 1;
      const cols = bounds.maxX - bounds.minX + 1;
      const cellHeight = height / rows;
      const cellWidth = Math.max(cellHeight / 2, width / cols);
      const centerX = (bounds.minX + bounds.maxX + 1) / 2;
      const centerY = (bounds.minY + bounds.maxY + 1) / 2;
      return {
        width,
        height,
        dpr: Math.min(2, Math.max(1, dpr || 1)),
        cellWidth,
        cellHeight,
        originX: width / 2 - centerX * cellWidth,
        originY: height / 2 - centerY * cellHeight
      };
    }

    function hashCell(slot, x, y) {
      let r = Math.imul(x ^ 2654435769, 2246822507);
      r ^= Math.imul(y ^ slot, 3266489909);
      r ^= r >>> 16;
      return r >>> 0;
    }

    const SCRAMBLE_CHARS = "!<>-_\\/[]{}=+*^?#%@·.:;'";
    const TOTAL_REVEAL_MS = 3000;
    const CASCADE_MS = 2200;
    const BASE_DURATION_MS = 360;
    const TICK_MS = 48;

    class LayerCache {
      constructor(layer, viewport) {
        this.layer = layer;
        this.viewport = viewport;
        this.settled = new Set();
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const entries = Object.entries(layer.cells);
        for (const [k, v] of entries) {
          const [x, y] = k.split(",").map(Number);
          const w = charWidth(v.char);
          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x + w - 1);
          maxY = Math.max(maxY, y);
        }
        this.bounds = entries.length ? { minX, minY, maxX, maxY } : { minX: 0, minY: 0, maxX: 0, maxY: 0 };
        this.canvas = document.createElement("canvas");
        const wPx = (this.bounds.maxX - this.bounds.minX + 1) * viewport.cellWidth;
        const hPx = (this.bounds.maxY - this.bounds.minY + 1) * viewport.cellHeight;
        this.canvas.width = Math.max(1, Math.ceil(wPx * viewport.dpr));
        this.canvas.height = Math.max(1, Math.ceil(hPx * viewport.dpr));
        this.ctx = this.canvas.getContext("2d");
        this.ctx.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
        this.ctx.font = `${viewport.cellHeight}px "jgs7", "PingFang SC", "Hiragino Sans GB", Menlo, monospace`;
        this.ctx.textBaseline = "top";
        this.ctx.imageSmoothingEnabled = false;
      }

      drawCell(ctx, ch, px, py) {
        const glyph = normalizeGlyph(ch);
        const w = charWidth(ch) * this.viewport.cellWidth;
        ctx.fillStyle = "#000000";
        ctx.fillRect(px, py, w, this.viewport.cellHeight);
        if (ch !== " ") {
          ctx.fillStyle = "rgba(200, 190, 181, 0.58)";
          ctx.fillText(glyph, px, py);
        }
      }

      settle(item) {
        if (item.slot !== this.layer.slot || this.settled.has(item.key)) return false;
        this.settled.add(item.key);
        this.drawCell(
          this.ctx,
          item.char,
          (item.x - this.bounds.minX) * this.viewport.cellWidth,
          (item.y - this.bounds.minY) * this.viewport.cellHeight
        );
        return true;
      }

      draw(targetCtx, offsetX, offsetY) {
        const w = this.canvas.width / this.viewport.dpr;
        const h = this.canvas.height / this.viewport.dpr;
        targetCtx.drawImage(
          this.canvas,
          this.viewport.originX + this.bounds.minX * this.viewport.cellWidth + offsetX,
          this.viewport.originY + this.bounds.minY * this.viewport.cellHeight + offsetY,
          w,
          h
        );
      }
    }

    class SkylineRenderer {
      constructor(canvas, layers, bounds) {
        this.canvas = canvas;
        this.bounds = bounds;
        this.viewport = computeViewport(window.innerWidth, window.innerHeight, window.devicePixelRatio, bounds);
        this.ctx = canvas.getContext("2d");
        canvas.width = Math.max(1, Math.round(this.viewport.width * this.viewport.dpr));
        canvas.height = Math.max(1, Math.round(this.viewport.height * this.viewport.dpr));
        this.ctx.setTransform(this.viewport.dpr, 0, 0, this.viewport.dpr, 0, 0);
        this.ctx.font = `${this.viewport.cellHeight}px "jgs7", "PingFang SC", "Hiragino Sans GB", Menlo, monospace`;
        this.ctx.textBaseline = "top";
        this.ctx.imageSmoothingEnabled = false;

        this.caches = layers.map(l => new LayerCache(l, this.viewport));
        this.schedule = [];
        const totalRows = Math.max(1, bounds.maxY - bounds.minY);
        for (const layer of layers) {
          for (const [k, cell] of Object.entries(layer.cells)) {
            const [x, y] = k.split(",").map(Number);
            const h = hashCell(layer.slot, x, y);
            const normY = Math.min(1, Math.max(0, (y - bounds.minY) / totalRows));
            const startMs = Math.round(normY * CASCADE_MS + (h % 141));
            const durationMs = Math.min(BASE_DURATION_MS + (h % 261), TOTAL_REVEAL_MS - startMs);
            this.schedule.push({
              ...cell,
              key: `${layer.slot}:${k}`,
              slot: layer.slot,
              x,
              y,
              startMs,
              durationMs
            });
          }
        }
        this.schedule.sort((a, b) => a.startMs - b.startMs || a.slot - b.slot || a.y - b.y || a.x - b.x);
        this.pending = new Set(this.schedule.map(i => i.key));
      }

      cellState(item, elapsedMs) {
        if (elapsedMs < item.startMs) return { phase: "hidden" };
        if (elapsedMs >= item.startMs + item.durationMs) return { phase: "settled", glyph: normalizeGlyph(item.char) };
        const step = Math.floor((elapsedMs - item.startMs) / TICK_MS);
        const idx = hashCell(item.slot, item.x + step * 17, item.y - step * 11) % 24;
        return { phase: "scrambling", glyph: SCRAMBLE_CHARS[idx] || "?" };
      }

      clear() {
        this.ctx.fillStyle = "#000000";
        this.ctx.fillRect(0, 0, this.viewport.width, this.viewport.height);
      }

      drawReveal(elapsedMs) {
        for (const item of this.schedule) {
          if (this.pending.has(item.key) && this.cellState(item, elapsedMs).phase === "settled") {
            const cache = this.caches.find(c => c.layer.slot === item.slot);
            if (cache) cache.settle(item);
            this.pending.delete(item.key);
          }
        }
        this.clear();
        for (const cache of this.caches) {
          cache.draw(this.ctx, 0, 0);
          for (const item of this.schedule) {
            if (item.slot !== cache.layer.slot || !this.pending.has(item.key)) continue;
            const st = this.cellState(item, elapsedMs);
            if (st.phase === "scrambling") {
              cache.drawCell(
                this.ctx,
                st.glyph,
                this.viewport.originX + item.x * this.viewport.cellWidth,
                this.viewport.originY + item.y * this.viewport.cellHeight
              );
            }
          }
        }
        return this.pending.size === 0 ? "settled" : "reveal";
      }

      drawParallax(pointer) {
        this.clear();
        for (const cache of this.caches) {
          const ox = pointer.x * cache.layer.depthRate * -12;
          const oy = pointer.y * cache.layer.depthRate * -6;
          cache.draw(this.ctx, ox, oy);
        }
      }
    }

    async function boot() {
      const canvas = document.getElementById("shanghai-background");
      await document.fonts?.load("16px jgs7");
      const layers = LAYER_SLOTS.map(slotInfo => {
        const found = PROJECT_DATA.layers.find(l => l.name === slotInfo.name) || PROJECT_DATA.layers[slotInfo.slot - 1];
        return { ...slotInfo, cells: found.cells };
      });

      let renderer = new SkylineRenderer(canvas, layers, BOUNDS);
      let phase = "reveal";
      let startTs = null;
      let lastTs = 0;
      let currentPtr = { x: 0, y: 0 };
      let targetPtr = { x: 0, y: 0 };

      function frame(ts) {
        const dt = lastTs === 0 ? 16 : ts - lastTs;
        lastTs = ts;
        if (phase === "reveal") {
          if (startTs === null) startTs = ts;
          const elapsed = Math.min(TOTAL_REVEAL_MS, ts - startTs);
          phase = renderer.drawReveal(elapsed);
          requestAnimationFrame(frame);
        } else {
          const alpha = 1 - Math.exp(-Math.min(50, Math.max(0, dt)) / 140);
          currentPtr.x += (targetPtr.x - currentPtr.x) * alpha;
          currentPtr.y += (targetPtr.y - currentPtr.y) * alpha;
          renderer.drawParallax(currentPtr);
          if (Math.abs(currentPtr.x - targetPtr.x) > 0.0005 || Math.abs(currentPtr.y - targetPtr.y) > 0.0005) {
            requestAnimationFrame(frame);
          }
        }
      }

      window.addEventListener("pointermove", e => {
        targetPtr = {
          x: Math.max(-1, Math.min(1, (e.clientX / window.innerWidth) * 2 - 1)),
          y: Math.max(-1, Math.min(1, (e.clientY / window.innerHeight) * 2 - 1))
        };
        if (phase === "settled") requestAnimationFrame(frame);
      }, { passive: true });

      window.addEventListener("message", e => {
        if (!e.data) return;
        if (e.data.type === "mushenzhen:pointer" || e.data.type === "mushanghai:pointer") {
          targetPtr = {
            x: Math.max(-1, Math.min(1, Number(e.data.x) || 0)),
            y: Math.max(-1, Math.min(1, Number(e.data.y) || 0))
          };
          if (phase === "settled") requestAnimationFrame(frame);
        } else if (e.data.type === "mushenzhen:replay" || e.data.type === "mushanghai:replay") {
          renderer = new SkylineRenderer(canvas, layers, BOUNDS);
          phase = "reveal";
          startTs = null;
          requestAnimationFrame(frame);
        }
      });

      window.addEventListener("resize", () => {
        renderer = new SkylineRenderer(canvas, layers, BOUNDS);
        if (phase === "settled") {
          renderer.drawReveal(TOTAL_REVEAL_MS);
          renderer.drawParallax(currentPtr);
        }
      });

      requestAnimationFrame(frame);
    }
    boot();
  </script>
</body>
</html>
